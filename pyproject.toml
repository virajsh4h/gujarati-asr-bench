[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gujasr"
version = "1.0.0"
description = "Reproducible Gujarati ASR benchmarking with bootstrap intervals and paired comparisons"
requires-python = ">=3.9"
dependencies = ["jiwer>=3.0", "numpy>=1.24"]

[project.optional-dependencies]
eval = ["torch", "transformers", "datasets", "accelerate", "tabulate", "tqdm"]
dev = ["pytest>=7"]
publish = ["huggingface_hub>=0.24"]

[project.scripts]
gujasr = "gujasr.cli:main"

[tool.setuptools]
packages = ["gujasr"]
py-modules = ["gu_normalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
